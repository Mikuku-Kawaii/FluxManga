[package]
name = "flux-manga-core"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "flux_manga_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "=0.29.4"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
thiserror = "=2.0.21"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "=0.17.14"
httpdate = "=1.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
# Keep the default unwind strategy used by UniFFI to report Rust panics.
strip = "debuginfo"
